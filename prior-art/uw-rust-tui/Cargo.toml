[package]
name = "uw"
version = "0.1.0"
edition = "2024"
description = "UltimateWrap - a standalone Rust TUI companion to Claude Code + CCR"
publish = false

[dependencies]
# Blocking HTTP client for the (Phase 5) CCR catalog read. The client's
# User-Agent MUST contain "claude" - see `src/http.rs` for why.
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ratatui = "0.29"
crossterm = "0.28"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security_Credentials",
] }
